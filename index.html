<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Editor de Baralhos Matemáticos</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>

  <style>
    :root {
      --cor-principal: #ff7aa2;
      --cor-texto: #ff3f8e;
      --fonte-carta: 'Arial', sans-serif;
    }

    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background-color: #2c3e50;
      margin: 0;
      padding: 30px;
      gap: 30px; 
    }

    /* -------------------------------------------
       PAINEL DE BARALHO (LISTA DE CARTAS)
    ------------------------------------------- */
    .painel-baralho {
      background-color: #34495e;
      padding: 20px;
      border-radius: 12px;
      width: 240px;
      color: white;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      max-height: 90vh;
      display: flex;
      flex-direction: column;
    }

    .painel-baralho h2 {
      margin-top: 0;
      font-size: 20px;
      text-align: center;
      border-bottom: 2px solid #2c3e50;
      padding-bottom: 10px;
    }

    .botoes-baralho {
      display: flex;
      flex-wrap: wrap; /* Permite que os botões se ajustem */
      gap: 8px;
      margin-bottom: 15px;
    }
    
    .botoes-baralho button {
      flex: 1 1 30%; /* Ajusta para caber 3 botões */
      padding: 8px 4px;
      font-size: 12px;
    }

    .btn-excluir {
      background-color: #e74c3c;
      color: white;
    }

    .btn-excluir:hover {
      background-color: #c0392b;
    }

    .lista-cartas {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 5px;
    }

    .miniatura-carta {
      background: #2c3e50;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: 0.2s;
      font-size: 14px;
    }
    
    .miniatura-carta:hover {
      background: #3e5b76;
    }

    .miniatura-carta.ativa {
      border-color: #f1c40f;
      background: #1a252f;
    }

    .miniatura-carta strong {
      color: #f1c40f;
    }

    /* -------------------------------------------
       PAINEL LATERAL (EDITOR)
    ------------------------------------------- */
    .painel-lateral {
      background-color: #34495e;
      padding: 20px;
      border-radius: 12px;
      width: 300px;
      color: white;
      box-shadow: 0 10px 20px rgba(0,0,0,0.3);
      max-height: 90vh;
      overflow-y: auto;
    }

    .painel-lateral h2 {
      margin-top: 0;
      font-size: 20px;
      text-align: center;
      border-bottom: 2px solid #2c3e50;
      padding-bottom: 10px;
    }

    .grupo-input { margin-bottom: 15px; }
    .grupo-input label { display: block; margin-bottom: 5px; font-size: 14px; font-weight: bold; }
    .grupo-input input[type="text"], .grupo-input input[type="number"], .grupo-input select {
      width: 100%; padding: 8px; border-radius: 6px; border: none; box-sizing: border-box; font-family: inherit;
    }
    .grupo-input input[type="color"] {
      width: 100%; height: 40px; border: none; border-radius: 6px; cursor: pointer; background: none;
    }

    /* -------------------------------------------
       ÁREA DA CARTA E BOTÕES PRINCIPAIS
    ------------------------------------------- */
    .area-carta {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .controles {
      margin-bottom: 20px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: 400px;
    }
    button {
      padding: 10px 15px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background-color: #f1c40f;
      color: #333;
      transition: 0.2s;
    }
    button:hover { background-color: #f39c12; }
    button:disabled { background-color: #7f8c8d; cursor: not-allowed; }

    /* ESTRUTURA 3D DA CARTA */
    .cena-carta { width: 250px; height: 350px; perspective: 1000px; }
    .carta { width: 100%; height: 100%; position: relative; transition: transform 0.6s; transform-style: preserve-3d; }
    .carta.virada { transform: rotateY(180deg); }
    .face {
      position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
      border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; overflow: hidden;
    }

    .card-front { background: #ffffff; border: 8px solid var(--cor-principal); position: relative; font-family: var(--fonte-carta); }

    /* MOLDURAS DINÂMICAS */
    .border-pattern { position: absolute; inset: 0; pointer-events: none; }
    .border-pattern::before { content: ""; position: absolute; inset: 0; }
    .border-pattern.flores::before { background: radial-gradient(circle at 12% 10%, #ff4d8d 0 10px, transparent 11px), radial-gradient(circle at 88% 14%, #ffd166 0 10px, transparent 11px), radial-gradient(circle at 18% 88%, #06d6a0 0 10px, transparent 11px), radial-gradient(circle at 84% 84%, #118ab2 0 10px, transparent 11px), radial-gradient(circle at 50% 8%, #ff9f1c 0 8px, transparent 9px), radial-gradient(circle at 8% 50%, #8338ec 0 8px, transparent 9px), radial-gradient(circle at 92% 50%, #ef476f 0 8px, transparent 9px), radial-gradient(circle at 50% 92%, #3a86ff 0 8px, transparent 9px); }
    .border-pattern.estrelas::before { background: radial-gradient(circle, #ffd700 0 2px, transparent 3px) 10px 20px/40px 40px, radial-gradient(circle, #fff176 0 2px, transparent 3px) 25px 5px/50px 50px, radial-gradient(circle, #ffeb3b 0 3px, transparent 4px) 5px 35px/60px 60px; }
    .border-pattern.confetes::before { background: radial-gradient(circle, #ff006e 0 4px, transparent 5px) 0 0/35px 35px, radial-gradient(circle, #8338ec 0 4px, transparent 5px) 18px 10px/45px 45px, radial-gradient(circle, #3a86ff 0 4px, transparent 5px) 8px 22px/50px 50px, radial-gradient(circle, #06d6a0 0 4px, transparent 5px) 25px 30px/55px 55px, radial-gradient(circle, #ffbe0b 0 4px, transparent 5px) 12px 40px/60px 60px; }
    .border-pattern.geometria::before { background: repeating-linear-gradient(45deg, rgba(255,0,110,0.18), rgba(255,0,110,0.18) 12px, transparent 12px, transparent 24px), repeating-linear-gradient(-45deg, rgba(58,134,255,0.16), rgba(58,134,255,0.16) 12px, transparent 12px, transparent 24px); }
    .border-pattern.espaco::before { background: radial-gradient(circle, white 0 1px, transparent 2px) 0 0/28px 28px, radial-gradient(circle, #90caf9 0 1px, transparent 2px) 14px 10px/34px 34px, radial-gradient(circle, #ce93d8 0 1px, transparent 2px) 6px 22px/40px 40px, radial-gradient(circle at 80% 20%, rgba(255,255,255,.25) 0 18px, transparent 19px), radial-gradient(circle at 20% 80%, rgba(144,202,249,.18) 0 22px, transparent 23px); }

    /* ELEMENTOS DA CARTA */
    .art { position: absolute; top: 55px; left: 20px; right: 20px; height: 170px; border-radius: 18px; background: #f3f4f6 center/cover no-repeat; border: 2px solid #e5e7eb; }
    .big-number { position: absolute; left: 50%; top: 72%; transform: translate(-50%, -50%); font-size: 140px; line-height: 1; font-weight: 900; background: linear-gradient(45deg, #ff006e, #ffbe0b, #70e000, #3a86ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .name { position: absolute; bottom: 18px; left: 18px; right: 18px; text-align: center; font-size: 22px; font-weight: bold; color: #333; text-transform: uppercase; }
    .symbol { position: absolute; top: 15px; right: 15px; width: 46px; height: 46px; border-radius: 12px; background: #fff; border: 2px solid #ffd166; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: bold; color: var(--cor-principal); }

    /* VERSO */
    .card-back { background-color: #111; transform: rotateY(180deg); border: 8px solid #34495e; }
    .back-bg { position: absolute; width: 100%; height: 100%; background: repeating-linear-gradient(45deg, #2c3e50, #2c3e50 10px, #34495e 10px, #34495e 20px); background-size: cover; background-position: center;}
    .back-overlay { position: absolute; width: 100%; height: 100%; box-shadow: inset 0 0 50px rgba(0,0,0,0.8); }
    .back-symbol { position: relative; font-size: 100px; color: #f1c40f; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); z-index: 2; }
  </style>
</head>
<body onload="inicializar()">

  <!-- 1. PAINEL DE GERENCIAMENTO DO BARALHO -->
  <div class="painel-baralho">
    <h2>Baralho</h2>
    <div class="botoes-baralho">
      <button onclick="adicionarCarta()">Nova</button>
      <button onclick="duplicarCarta()">Duplicar</button>
      <button class="btn-excluir" onclick="excluirCarta()">Excluir</button>
    </div>
    <div class="lista-cartas" id="listaCartas">
      <!-- Miniaturas geradas via JS -->
    </div>
  </div>

  <!-- 2. PAINEL DE EDIÇÃO DA CARTA SELECIONADA -->
  <div class="painel-lateral">
    <h2>Editar Carta</h2>
    
    <div class="grupo-input">
      <label for="inputNome">Nome:</label>
      <input type="text" id="inputNome" oninput="salvarAlteracoes()">
    </div>

    <div class="grupo-input">
      <label for="inputNumero">Número:</label>
      <input type="number" id="inputNumero" oninput="salvarAlteracoes()">
    </div>

    <div class="grupo-input">
      <label for="inputSimbolo">Símbolo / Operador:</label>
      <input type="text" id="inputSimbolo" maxlength="3" oninput="salvarAlteracoes()">
    </div>

    <div class="grupo-input">
      <label for="inputCor">Cor Principal:</label>
      <input type="color" id="inputCor" oninput="salvarAlteracoes()">
    </div>

    <div class="grupo-input">
      <label for="inputFonte">Fonte:</label>
      <select id="inputFonte" onchange="salvarAlteracoes()">
        <option value="'Arial', sans-serif">Arial</option>
        <option value="'Courier New', Courier, monospace">Courier New</option>
        <option value="'Times New Roman', Times, serif">Times New Roman</option>
        <option value="'Impact', sans-serif">Impact</option>
        <option value="'Comic Sans MS', cursive, sans-serif">Comic Sans</option>
      </select>
    </div>

    <div class="grupo-input">
      <label for="inputMoldura">Moldura:</label>
      <select id="inputMoldura" onchange="salvarAlteracoes()">
        <option value="flores">Flores</option>
        <option value="estrelas">Estrelas</option>
        <option value="confetes">Confetes</option>
        <option value="geometria">Geometria</option>
        <option value="espaco">Espaço</option>
      </select>
    </div>
    
    <div class="grupo-input">
      <label>Arte da Frente (Imagem)</label>
      <input type="file" id="uploadFrente" accept="image/*" onchange="carregarImagemBase64(this, 'frente')">
    </div>

    <div class="grupo-input">
      <label>Arte do Verso (Imagem)</label>
      <input type="file" id="uploadVerso" accept="image/*" onchange="carregarImagemBase64(this, 'verso')">
    </div>
  </div>

  <!-- 3. ÁREA DE PREVIEW E EXPORTAÇÃO -->
  <div class="area-carta">
    <div class="controles">
      <button onclick="virarCarta()">Mostrar Verso</button>
      <button onclick="exportarPNG()">Baixar Esta Carta (PNG)</button>
      <button id="btnExportarA4" onclick="exportarBaralhoA4()" style="background-color: #e74c3c; color: white;">Exportar Baralho (Folhas A4)</button>
    </div>

    <div class="cena-carta">
      <div class="carta" id="cartaContainer">
        <!-- Lado da Frente -->
        <div class="face card-front" id="front">
          <div class="border-pattern flores" id="borderPattern"></div>
          <div class="symbol" id="symbol">+</div>
          <div class="art" id="frontArt"></div>
          <div class="big-number" id="number">1</div>
          <div class="name" id="name">ANA</div>
        </div>
        <!-- Lado do Verso -->
        <div class="face card-back" id="back">
          <div class="back-bg" id="backArt"></div>
          <div class="back-overlay"></div>
          <div class="back-symbol" id="backSymbol">+</div>
        </div>
      </div>
    </div>
  </div>

  <!-- SCRIPTS E LÓGICA DO SISTEMA -->
  <script>
    // 1. O BANCO DE DADOS (ARRAY)
    let cartas = [
      {
        nome: "ANA",
        numero: 1,
        simbolo: "+",
        cor: "#ff7aa2",
        fonte: "'Arial', sans-serif",
        moldura: "flores",
        frente: null,
        verso: null
      },
      {
        nome: "BRUNO",
        numero: 2,
        simbolo: "-",
        cor: "#3a86ff",
        fonte: "'Comic Sans MS', cursive, sans-serif",
        moldura: "estrelas",
        frente: null,
        verso: null
      }
    ];

    let cartaAtual = 0;

    // Inicia o sistema
    function inicializar() {
      renderizarListaCartas();
      selecionarCarta(0);
    }

    // 2. GERENCIAMENTO DA LISTA (BARALHO)
    function renderizarListaCartas() {
      const lista = document.getElementById('listaCartas');
      lista.innerHTML = ''; 

      cartas.forEach((carta, index) => {
        const div = document.createElement('div');
        div.className = 'miniatura-carta' + (index === cartaAtual ? ' ativa' : '');
        div.innerHTML = `<strong>${carta.numero}</strong> • ${carta.nome || 'Sem Nome'}`;
        div.onclick = () => selecionarCarta(index);
        lista.appendChild(div);
      });
    }

    function adicionarCarta() {
      const nova = {
        nome: "NOVA", numero: cartas.length + 1, simbolo: "?", cor: "#06d6a0",
        fonte: "'Arial', sans-serif", moldura: "geometria", frente: null, verso: null
      };
      cartas.push(nova);
      selecionarCarta(cartas.length - 1);
    }

    function duplicarCarta() {
      const copia = JSON.parse(JSON.stringify(cartas[cartaAtual]));
      copia.nome = copia.nome + " (Cópia)";
      cartas.push(copia);
      selecionarCarta(cartas.length - 1);
    }

    // NOVA FUNÇÃO: Excluir Carta
    function excluirCarta() {
      // Regra de segurança: Não pode excluir se só houver 1 carta
      if (cartas.length <= 1) {
        alert("O baralho precisa ter pelo menos uma carta!");
        return;
      }

      // Confirmação para evitar exclusões acidentais
      const confirmacao = confirm(`Tem certeza que deseja excluir a carta "${cartas[cartaAtual].nome}"?`);
      if (!confirmacao) return;

      // Remove 1 elemento do array na posição da cartaAtual
      cartas.splice(cartaAtual, 1);

      // Se apagamos a última carta da lista, recuamos o índice em 1
      if (cartaAtual >= cartas.length) {
        cartaAtual = cartas.length - 1;
      }

      // Atualiza a tela com a nova carta selecionada
      selecionarCarta(cartaAtual);
    }

    // 3. SELEÇÃO E EDIÇÃO NO PAINEL
    function selecionarCarta(index) {
      cartaAtual = index;
      const carta = cartas[cartaAtual];

      // Preenche os Inputs
      document.getElementById('inputNome').value = carta.nome;
      document.getElementById('inputNumero').value = carta.numero;
      document.getElementById('inputSimbolo').value = carta.simbolo;
      document.getElementById('inputCor').value = carta.cor;
      document.getElementById('inputFonte').value = carta.fonte;
      document.getElementById('inputMoldura').value = carta.moldura;
      
      // Limpa os campos de arquivo
      document.getElementById('uploadFrente').value = "";
      document.getElementById('uploadVerso').value = "";

      renderizarListaCartas(); 
      aplicarCartaNoDOM(carta); 
    }

    function salvarAlteracoes() {
      const carta = cartas[cartaAtual];
      
      carta.nome = document.getElementById('inputNome').value;
      carta.numero = document.getElementById('inputNumero').value;
      carta.simbolo = document.getElementById('inputSimbolo').value;
      carta.cor = document.getElementById('inputCor').value;
      carta.fonte = document.getElementById('inputFonte').value;
      carta.moldura = document.getElementById('inputMoldura').value;

      renderizarListaCartas(); 
      aplicarCartaNoDOM(carta); 
    }

    function carregarImagemBase64(input, face) {
      const file = input.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        cartas[cartaAtual][face] = e.target.result; 
        aplicarCartaNoDOM(cartas[cartaAtual]);
      };
      reader.readAsDataURL(file);
    }

    // 4. ATUALIZAÇÃO VISUAL (RENDER)
    function aplicarCartaNoDOM(carta) {
      document.getElementById('name').innerText = carta.nome;
      document.getElementById('number').innerText = carta.numero;
      document.getElementById('symbol').innerText = carta.simbolo;
      document.getElementById('backSymbol').innerText = carta.simbolo; 

      document.documentElement.style.setProperty('--cor-principal', carta.cor);
      document.documentElement.style.setProperty('--cor-texto', carta.cor);
      document.documentElement.style.setProperty('--fonte-carta', carta.fonte);

      document.getElementById('borderPattern').className = 'border-pattern ' + carta.moldura;

      const frontArt = document.getElementById('frontArt');
      frontArt.style.backgroundImage = carta.frente ? `url('${carta.frente}')` : 'none';
      
      const backArt = document.getElementById('backArt');
      backArt.style.backgroundImage = carta.verso ? `url('${carta.verso}')` : 'none';
    }

    function virarCarta() {
      const cartaElement = document.getElementById('cartaContainer');
      cartaElement.classList.toggle('virada');
      
      const botaoVirar = document.querySelector('.controles button:first-child');
      if (cartaElement.classList.contains('virada')) {
        botaoVirar.innerText = "Mostrar Frente";
      } else {
        botaoVirar.innerText = "Mostrar Verso";
      }
    }

    // 5. EXPORTAÇÃO INDIVIDUAL (1 Carta)
    function exportarPNG() {
      const cartaContainer = document.getElementById('cartaContainer');
      const estaVirada = cartaContainer.classList.contains('virada');
      const elemento = document.getElementById(estaVirada ? 'back' : 'front');

      const transformOriginal = elemento.style.transform;
      elemento.style.transform = 'none';

      htmlToImage.toPng(elemento, { pixelRatio: 4, cacheBust: true, backgroundColor: null })
        .then((dataUrl) => {
          elemento.style.transform = transformOriginal;
          const link = document.createElement('a');
          link.download = `Carta_${cartas[cartaAtual].numero}_${cartas[cartaAtual].nome}.png`;
          link.href = dataUrl;
          link.click();
        }).catch(e => {
          elemento.style.transform = transformOriginal;
          alert('Erro ao exportar a carta.');
        });
    }

    // 6. O LOOP MÁGICO DE EXPORTAÇÃO A4
    async function exportarBaralhoA4() {
      const btn = document.getElementById('btnExportarA4');
      btn.innerText = "Gerando Baralho... Aguarde";
      btn.disabled = true;

      const indiceBackup = cartaAtual;
      
      const cartaContainer = document.getElementById('cartaContainer');
      const estaVirada = cartaContainer.classList.contains('virada');
      const elemento = document.getElementById(estaVirada ? 'back' : 'front');
      const transformOriginal = elemento.style.transform;
      elemento.style.transform = 'none';

      const imagensGeradas = [];

      try {
        for (let i = 0; i < cartas.length; i++) {
          btn.innerText = `Processando ${i + 1}/${cartas.length}...`;
          aplicarCartaNoDOM(cartas[i]);
          await new Promise(r => setTimeout(r, 100));
          const dataUrl = await htmlToImage.toPng(elemento, { pixelRatio: 4, cacheBust: true, backgroundColor: null });
          imagensGeradas.push(dataUrl);
        }

        const totalPaginas = Math.ceil(imagensGeradas.length / 9);

        for (let p = 0; p < totalPaginas; p++) {
          btn.innerText = `Montando Página ${p + 1}/${totalPaginas}...`;
          
          const canvas = document.createElement('canvas');
          canvas.width = 2480;
          canvas.height = 3508;
          const ctx = canvas.getContext('2d');
          
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, canvas.width, canvas.height);

          const cardW = 744, cardH = 1039, escala = 0.95;
          const w = cardW * escala, h = cardH * escala;
          const margemX = 120, margemY = 140, espX = 40, espY = 40;

          for (let i = 0; i < 9; i++) {
            const indexGlobal = (p * 9) + i;
            if (indexGlobal >= imagensGeradas.length) break; 

            const linha = Math.floor(i / 3);
            const coluna = i % 3;
            const x = margemX + coluna * (w + espX);
            const y = margemY + linha * (h + espY);

            const imgObj = new Image();
            imgObj.src = imagensGeradas[indexGlobal];
            
            await new Promise((resolve) => {
              imgObj.onload = () => {
                ctx.drawImage(imgObj, x, y, w, h);
                desenharMarcas(ctx, x, y, w, h);
                resolve();
              };
            });
          }

          const link = document.createElement('a');
          link.download = `Folha_${p + 1}_${estaVirada ? 'Verso' : 'Frente'}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
          
          await new Promise(r => setTimeout(r, 600)); 
        }
      } catch (err) {
        console.error(err);
        alert('Erro durante a geração do baralho.');
      } finally {
        elemento.style.transform = transformOriginal;
        selecionarCarta(indiceBackup); 
        btn.innerText = "Exportar Baralho (Folhas A4)";
        btn.disabled = false;
      }
    }

    function desenharMarcas(ctx, x, y, w, h) {
      const t = 18;
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(x - t, y); ctx.lineTo(x, y); ctx.lineTo(x, y - t); 
      ctx.moveTo(x + w + t, y); ctx.lineTo(x + w, y); ctx.lineTo(x + w, y - t); 
      ctx.moveTo(x - t, y + h); ctx.lineTo(x, y + h); ctx.lineTo(x, y + h + t); 
      ctx.moveTo(x + w + t, y + h); ctx.lineTo(x + w, y + h); ctx.lineTo(x + w, y + h + t); 
      ctx.stroke();
    }
  </script>
</body>
</html>
