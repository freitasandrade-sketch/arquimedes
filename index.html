<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Minha Carta</title>
  
  <!-- Importando a biblioteca html2canvas para conseguir exportar o PNG -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* Estilos gerais da página */
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #2c3e50;
      margin-top: 50px;
    }

    /* Estilo dos botões */
    .controles {
      margin-bottom: 30px;
      display: flex;
      gap: 15px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      background-color: #f1c40f;
      color: #333;
      transition: 0.2s;
    }
    button:hover {
      background-color: #f39c12;
    }

    /* -------------------------------------------
       ESTRUTURA 3D DA CARTA
    ------------------------------------------- */
    .cena-carta {
      width: 250px;
      height: 350px;
      perspective: 1000px; /* Dá a sensação de profundidade no giro */
    }

    .carta {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.6s;
      transform-style: preserve-3d; /* Mantém as frentes e versos no espaço 3D */
    }

    /* Classe que o JavaScript vai adicionar para girar a carta */
    .carta.virada {
      transform: rotateY(180deg);
    }

    /* Configuração padrão para os dois lados da carta */
    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden; /* Esconde o lado que está de costas */
      border-radius: 15px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* A frente da carta */
   
.card-front{
    background:#ffffff;
    border:8px solid #ff7aa2;
    position:relative;
}

.border-pattern{
    position:absolute;
    inset:0;
    pointer-events:none;
}

.border-pattern::before{
    content:"";
    position:absolute;
    inset:0;
    background:
      radial-gradient(circle at 12% 10%, #ff4d8d 0 10px, transparent 11px),
      radial-gradient(circle at 88% 14%, #ffd166 0 10px, transparent 11px),
      radial-gradient(circle at 18% 88%, #06d6a0 0 10px, transparent 11px),
      radial-gradient(circle at 84% 84%, #118ab2 0 10px, transparent 11px);
}

.art{
    position:absolute;
    top:55px;
    left:20px;
    right:20px;
    height:170px;
    border-radius:18px;
    background:#f3f4f6 center/cover no-repeat;
    border:2px solid #e5e7eb;
}

.big-number{
    position:absolute;

    /* Centralização perfeita */
    left:50%;
    top:72%;
    transform:translate(-50%, -50%);

    font-size:140px;
    line-height:1;
    font-family:'Arial', sans-serif;
    font-weight:900;
    color:#ff3f8e;
    text-shadow:0 3px 0 rgba(0,0,0,.08);
}

.name{
    position:absolute;
    bottom:18px;
    left:18px;
    right:18px;
    text-align:center;
    font-size:22px;
    font-weight:bold;
}

.symbol{
    position:absolute;
    top:15px;
    right:15px;
    width:46px;
    height:46px;
    border-radius:12px;
    background:#fff;
    border:2px solid #ffd166;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    font-weight:bold;
    color:#ff7aa2;
}
    /* -------------------------------------------
       SEU CÓDIGO DO VERSO (ESTILIZADO)
    ------------------------------------------- */
    .card-back {
      background-color: #111;
      transform: rotateY(180deg); /* O verso já começa "virado" 180 graus de costas */
      border: 8px solid #34495e;
    }

    .back-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      /* Criando um fundo desenhado com CSS */
      background: repeating-linear-gradient(
        45deg,
        #2c3e50,
        #2c3e50 10px,
        #34495e 10px,
        #34495e 20px
      );
    }

    .back-overlay {
      position: absolute;
      width: 100%;
      height: 100%;
      /* Sombra interna para dar volume */
      box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
    }

    .back-symbol {
      position: relative;
      font-size: 100px;
      color: #f1c40f;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
      z-index: 2; /* Garante que o símbolo fique acima do fundo */
    }
  </style>
</head>
<body>

  <!-- Os botões que antes eram apenas texto -->
  <div class="controles">
    <button onclick="virarCarta()">Mostrar Verso</button>
    <button onclick="exportarPNG()">Exportar PNG</button>
  </div>

  <!-- A cena 3D -->
  <div class="cena-carta">
    <div class="carta" id="cartaContainer">
      
      <!-- Lado da Frente -->
    <div class="face card-front" id="front">
    <div class="border-pattern"></div>

    <!-- Símbolo no canto -->
    <div class="symbol" id="symbol">+</div>

    <!-- Área da imagem -->
    <div class="art" id="frontArt"></div>

    <!-- Número centralizado -->
    <div class="big-number" id="number">2</div>

    <!-- Nome do personagem -->
    <div class="name" id="name">ZOLTAN</div>
</div>
      <!-- O SEU CÓDIGO DO VERSO -->
      <div class="face card-back" id="back">
        <div class="back-bg" id="backArt"></div>
        <div class="back-overlay"></div>
        <div class="back-symbol">+</div>
      </div>

    </div>
  </div>

  <script>
    // Função para virar a carta
    function virarCarta() {
      const carta = document.getElementById('cartaContainer');
      carta.classList.toggle('virada');
    }

    // Função para baixar a imagem usando a biblioteca html2canvas
    function exportarPNG() {
      // Capturamos especificamente a div com id="back"
      const elementoParaBaixar = document.getElementById('back');
      
      html2canvas(elementoParaBaixar, {
        backgroundColor: null, // Mantém o fundo transparente se houver bordas arredondadas
        scale: 2 // Aumenta a resolução da imagem baixada
      }).then(canvas => {
        // Cria um link temporário e simula o clique para baixar
        const link = document.createElement('a');
        link.download = 'verso-da-carta.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }
  </script>
</body>
</html>
