<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Editor de Baralhos Matemáticos</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <script src="script.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body onload="inicializar()">

  <div class="painel-baralho">
    <h2>Baralho</h2>
    <div class="botoes-baralho">
      <button onclick="adicionarCarta()">Nova</button>
      <button onclick="duplicarCarta()">Duplicar</button>
      <button class="btn-excluir" onclick="excluirCarta()">Excluir</button>
    </div>
    <div class="lista-cartas" id="listaCartas"></div>
  </div>

  <!-- PAINEL DO EDITOR OTIMIZADO -->
  <div class="painel-lateral">
    <h2>Editar Carta</h2>
    
    <!-- ETAPA 1: ESTRUTURA -->
    <div class="secao-editor">
      <h3>Estrutura</h3>
      <div class="grupo-input">
        <label>Tipo de carta</label>
        <div class="seletor-botoes">
          <button class="btn-layout" data-valor="padrao" onclick="mudarLayout('padrao')">Carta completa</button>
          <button class="btn-layout" data-valor="numero-gigante" onclick="mudarLayout('numero-gigante')">Número</button>
          <button class="btn-layout" data-valor="operador" onclick="mudarLayout('operador')">Operador</button>
        </div>
      </div>
    </div>

    <!-- ETAPA 2: CONTEÚDO -->
    <div class="secao-editor" id="secaoConteudo">
      <h3>Conteúdo</h3>
      
      <div class="grupo-input" id="grupoNome">
        <label for="inputNome">Nome:</label>
        <input type="text" id="inputNome" oninput="salvarAlteracoes()">
      </div>

      <div class="grupo-input" id="grupoNumero">
        <label for="inputNumero">Número:</label>
        <input type="text" id="inputNumero" oninput="salvarAlteracoes()">
      </div>

      <div class="grupo-input" id="grupoExpressao">
        <label for="inputFormula">Operador ou fórmula:</label>
        <input type="text" id="inputFormula" value="+" oninput="salvarAlteracoes()">
      </div>
    </div>

    <!-- ETAPA 3: APARÊNCIA -->
    <div class="secao-editor" id="secaoAparencia">
      <h3>Aparência</h3>

      <div class="grupo-input" id="grupoEstilo">
        <label>Estilo do número</label>
        <div class="seletor-miniaturas">
          <div class="miniatura-opcao btn-estilo estilo-padrao" data-valor="padrao" onclick="mudarEstilo('padrao')" title="Padrão">8</div>
          <div class="miniatura-opcao btn-estilo estilo-vitral" data-valor="vitral" onclick="mudarEstilo('vitral')" title="Vitral">8</div>
          <div class="miniatura-opcao btn-estilo estilo-Geométrico" data-valor="Geométrico" onclick="mudarEstilo('Geométrico')" title="Geométrico">8</div>
          <div class="miniatura-opcao btn-estilo estilo-colorblock" data-valor="colorblock" onclick="mudarEstilo('colorblock')" title="Colorblock">8</div>
          <div class="miniatura-opcao btn-estilo estilo-vitral2" data-valor="vitral2" onclick="mudarEstilo('vitral2')" title="Vitral Clássico">8</div>
        </div>
      </div>

      <div class="grupo-input" id="grupoMoldura">
        <label>Moldura</label>
        <div class="seletor-miniaturas">
          <div class="miniatura-opcao btn-moldura" data-valor="flores" onclick="mudarMoldura('flores')" title="Flores">
            <div class="border-pattern flores mini-pattern"></div>
          </div>
          <div class="miniatura-opcao btn-moldura" data-valor="estrelas" onclick="mudarMoldura('estrelas')" title="Estrelas">
            <div class="border-pattern estrelas mini-pattern"></div>
          </div>
          <div class="miniatura-opcao btn-moldura" data-valor="confetes" onclick="mudarMoldura('confetes')" title="Confetes">
            <div class="border-pattern confetes mini-pattern"></div>
          </div>
          <div class="miniatura-opcao btn-moldura" data-valor="geometria" onclick="mudarMoldura('geometria')" title="Geometria">
            <div class="border-pattern geometria mini-pattern"></div>
          </div>
          <div class="miniatura-opcao btn-moldura" data-valor="espaco" onclick="mudarMoldura('espaco')" title="Espaço">
            <div class="border-pattern espaco mini-pattern"></div>
          </div>
        </div>
      </div>

      <div class="grupo-input" id="grupoCor">
        <label for="inputCor">Cor Principal:</label>
        <input type="color" id="inputCor" oninput="salvarAlteracoes()">
        <small id="avisoCor" class="aviso-texto escondido">Este estilo utiliza cores próprias.</small>
      </div>

      <div class="grupo-input" id="grupoFonte">
        <label for="inputFonte">Fonte:</label>
        <select id="inputFonte" onchange="salvarAlteracoes()">
          <option value="'Arial', sans-serif">Arial</option>
          <option value="'Courier New', Courier, monospace">Courier New</option>
          <option value="'Times New Roman', Times, serif">Times New Roman</option>
          <option value="'Impact', sans-serif">Impact</option>
          <option value="'Comic Sans MS', cursive, sans-serif">Comic Sans</option>
        </select>
      </div>
    </div>
    
    <!-- ETAPA 4: IMAGENS -->
    <div class="secao-editor" id="secaoImagens">
      <h3>Imagens</h3>
      <div class="grupo-input">
        <label>Imagem da frente</label>
        <input type="file" id="uploadFrente" accept="image/*" onchange="carregarImagemBase64(this, 'frente')">
      </div>

      <div class="grupo-input">
        <label>Imagem do verso</label>
        <input type="file" id="uploadVerso" accept="image/*" onchange="carregarImagemBase64(this, 'verso')">
      </div>
    </div>
  </div>

  <!-- ÁREA DA CARTA -->
  <div class="area-carta">
    <div class="controles">
      <button onclick="virarCarta()">Mostrar Verso</button>
      <button onclick="exportarPNG()">Baixar Esta Carta (PNG)</button>
      <button id="btnExportarA4" onclick="exportarBaralhoA4()" style="background-color: #e74c3c; color: white;">Exportar Baralho (Folhas A4)</button>
    </div>

    <div class="cena-carta">
      <div class="carta" id="cartaContainer">
        <div class="face card-front" id="front">
          <div class="border-pattern flores" id="borderPattern"></div>
          <div class="symbol" id="symbol"><span id="formulaPreview">+</span></div>
          <div class="art" id="frontArt"></div>
          <div class="big-number estilo-padrao" id="number">1</div>
          <div class="name" id="name">ANA</div>
        </div>
        <div class="face card-back" id="back">
          <div class="back-bg" id="backArt"></div>
          <div class="back-overlay"></div>
          <div class="back-symbol" id="backSymbol">+</div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
