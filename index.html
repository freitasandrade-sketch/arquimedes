<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editor de Cartas Matemáticas</title>

<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&family=Fredoka:wght@400;600&family=Nunito:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
  --card-w: 315px;
  --card-h: 440px;
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#ececec;
  display:flex;
  min-height:100vh;
}

.sidebar{
  width:340px;
  background:#ffffff;
  padding:20px;
  overflow:auto;
  border-right:1px solid #ddd;
}

.sidebar h2{
  margin-top:0;
}

.control{
  margin-bottom:16px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

input[type=text],
input[type=number],
select{
  width:100%;
  padding:10px;
  border:1px solid #ccc;
  border-radius:8px;
  font-size:16px;
}

input[type=color]{
  width:100%;
  height:44px;
  border:none;
  background:none;
}

button{
  width:100%;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#2563eb;
  color:white;
  font-size:16px;
  cursor:pointer;
  margin-top:8px;
}

button.secondary{
  background:#6b7280;
}

.preview{
  flex:1;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:30px;
}

.card{
  width:var(--card-w);
  height:var(--card-h);
  border-radius:24px;
  background:white;
  position:relative;
  overflow:hidden;
  box-shadow:0 18px 40px rgba(0,0,0,.25);
  border:8px solid #ff7aa2;
}

.border-pattern{
  position:absolute;
  inset:0;
  pointer-events:none;
}

.border-pattern::before,
.border-pattern::after{
  content:'';
  position:absolute;
  inset:0;
}

.border-pattern::before{
  background:
    radial-gradient(circle at 12% 10%, #ff4d8d 0 10px, transparent 11px),
    radial-gradient(circle at 88% 14%, #ffd166 0 10px, transparent 11px),
    radial-gradient(circle at 18% 88%, #06d6a0 0 10px, transparent 11px),
    radial-gradient(circle at 84% 84%, #118ab2 0 10px, transparent 11px),
    radial-gradient(circle at 50% 6%, #ff9f1c 0 8px, transparent 9px),
    radial-gradient(circle at 6% 50%, #8338ec 0 8px, transparent 9px),
    radial-gradient(circle at 94% 50%, #ef476f 0 8px, transparent 9px),
    radial-gradient(circle at 50% 94%, #3a86ff 0 8px, transparent 9px);
}

.border-pattern::after{
  inset:10px;
  border:3px solid rgba(255,122,162,.45);
  border-radius:18px;
}

.card-front,
.card-back{
  position:absolute;
  inset:0;
}

.card-back{
  display:none;
}

.art{
  position:absolute;
  top:74px;
  left:26px;
  right:26px;
  height:200px;
  border-radius:18px;
  background:#f3f4f6 center/cover no-repeat;
  border:2px solid #e5e7eb;
}

.big-number{
  position:absolute;
  bottom:78px;
  left:0;
  right:0;
  text-align:center;
  font-size:150px;
  line-height:1;
  font-family:'Baloo 2', cursive;
  font-weight:700;
  color:#ff3f8e;
  text-shadow:0 3px 0 rgba(0,0,0,.08);
}

.symbol{
  position:absolute;
  top:18px;
  right:18px;
  width:48px;
  height:48px;
  border-radius:14px;
  background:#ffffff;
  border:2px solid #ffd166;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:700;
  color:#ff7aa2;
}

.name{
  position:absolute;
  bottom:18px;
  left:18px;
  right:18px;
  text-align:center;
  font-size:22px;
  font-weight:700;
  letter-spacing:.5px;
}

.back-bg{
  position:absolute;
  inset:0;
  background:#ffffff center/cover no-repeat;
}

.back-overlay{
  position:absolute;
  inset:18px;
  border-radius:18px;
  border:3px dashed rgba(37,99,235,.25);
}

.back-symbol{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:120px;
  color:rgba(37,99,235,.16);
  font-family:'Fredoka', sans-serif;
  font-weight:600;
}
</style>

</head>
<body>

<div class="sidebar">
  <h2>Editor da Carta</h2>

  <div class="control">
    <label>Número</label>
    <input id="numberInput" type="number" value="2">
  </div>

  <div class="control">
    <label>Nome</label>
    <input id="nameInput" type="text" value="ZOLTAN">
  </div>

  <div class="control">
    <label>Símbolo</label>
    <select id="symbolInput">
      <option>+</option>
      <option>-</option>
      <option>×</option>
      <option>÷</option>
      <option>=</option>
    </select>
  </div>

  <div class="control">
    <label>Fonte</label>
    <select id="fontInput">
      <option value="'Baloo 2', cursive">Baloo 2</option>
      <option value="'Fredoka', sans-serif">Fredoka</option>
      <option value="'Nunito', sans-serif">Nunito</option>
      <option value="Arial, sans-serif">Arial</option>
    </select>
  </div>

  <div class="control">
    <label>Cor do número</label>
    <input id="colorInput" type="color" value="#ff3f8e">
  </div>

  <div class="control">
    <label>Arte da frente</label>
    <input id="frontUpload" type="file" accept="image/*">
  </div>

  <div class="control">
    <label>Arte do verso</label>
    <input id="backUpload" type="file" accept="image/*">
  </div>

<button id="toggleBtn">Mostrar Verso</button> <button id="downloadBtn" class="secondary">Exportar PNG</button>

</div>

<div class="preview">
  <div class="card" id="card">
    <div class="card-front" id="front">
      <div class="border-pattern"></div>
      <div class="symbol" id="symbol">+</div>
      <div class="art" id="frontArt"></div>
      <div class="big-number" id="number">2</div>
      <div class="name" id="name">ZOLTAN</div>
    </div>

```
<div class="card-back" id="back">
  <div class="back-bg" id="backArt"></div>
  <div class="back-overlay"></div>
  <div class="back-symbol">+</div>
</div>
```

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<script>
const numberEl = document.getElementById('number');
const nameEl = document.getElementById('name');
const symbolEl = document.getElementById('symbol');
const frontArt = document.getElementById('frontArt');
const backArt = document.getElementById('backArt');

document.getElementById('numberInput').addEventListener('input', e => {
  numberEl.textContent = e.target.value || '';
});

document.getElementById('nameInput').addEventListener('input', e => {
  nameEl.textContent = e.target.value.toUpperCase();
});

document.getElementById('symbolInput').addEventListener('change', e => {
  symbolEl.textContent = e.target.value;
  document.querySelector('.back-symbol').textContent = e.target.value;
});

document.getElementById('fontInput').addEventListener('change', e => {
  numberEl.style.fontFamily = e.target.value;
  nameEl.style.fontFamily = e.target.value;
});

document.getElementById('colorInput').addEventListener('input', e => {
  numberEl.style.color = e.target.value;
});

function loadImage(input, target){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    target.style.backgroundImage = `url('${ev.target.result}')`;
  };
  reader.readAsDataURL(file);
}

document.getElementById('frontUpload').addEventListener('change', e => loadImage(e.target, frontArt));
document.getElementById('backUpload').addEventListener('change', e => loadImage(e.target, backArt));

let showingBack = false;
const front = document.getElementById('front');
const back = document.getElementById('back');

document.getElementById('toggleBtn').addEventListener('click', () => {
  showingBack = !showingBack;
  front.style.display = showingBack ? 'none' : 'block';
  back.style.display = showingBack ? 'block' : 'none';
  document.getElementById('toggleBtn').textContent = showingBack ? 'Mostrar Frente' : 'Mostrar Verso';
});

document.getElementById('downloadBtn').addEventListener('click', async () => {
  const canvas = await html2canvas(document.getElementById('card'), {
    backgroundColor: null,
    scale: 3
  });
  const link = document.createElement('a');
  link.download = showingBack ? 'carta-verso.png' : 'carta-frente.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
});
</script>

</body>
</html>
