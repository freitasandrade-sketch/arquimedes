<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Editor de Baralhos Matemáticos</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>

  <script src="script.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body onload="inicializar()">

  <div class="painel-baralho">
    <h2>Baralho</h2>
    <div class="botoes-baralho">
      <button onclick="adicionarCarta()">Nova</button>
      <button onclick="duplicarCarta()">Duplicar</button>
      <button class="btn-excluir" onclick="excluirCarta()">Excluir</button>
    </div>
    <div class="lista-cartas" id="listaCartas"></div>
  </div>

  <div class="painel-lateral">
    <h2>Editar Carta</h2>
    
    <div class="grupo-input">
      <label for="inputLayout">Tipo de Carta (Layout):</label>
      <select id="inputLayout" onchange="salvarAlteracoes()">
        <option value="padrao">Padrão (Personagem/Completa)</option>
        <option value="numero-gigante">Apenas Número Central</option>
        <option value="operador">Operador Matemático</option>
      </select>
    </div>

    <div class="grupo-input">
      <label for="inputNome">Nome:</label>
      <input type="text" id="inputNome" oninput="salvarAlteracoes()">
    </div>

    <div class="grupo-input">
      <label for="inputNumero">Número:</label>
      <input type="text" id="inputNumero" oninput="salvarAlteracoes()">
    </div>

    <!-- NOVO: Seletor de Estilo do Número -->
    <div class="grupo-input">
      <label for="inputEstiloNumero">Estilo do Número:</label>
      <select id="inputEstiloNumero" onchange="salvarAlteracoes()">
        <option value="padrao">Padrão (Gradiente Suave)</option>
<option value="vitral">Vitral</option>
       <option value="Geométrico"> Geométrico </option>
<option value="colorblock">colorblock (Colorido com Borda)</option>
<option value="vitral2">Vitral (Colorido com Borda)</option>


      </select>
    </div>

    <div class="grupo-input">
      <label for="inputFormula">Expressão Matemática (LaTeX):</label>
      <input type="text" id="inputFormula" value="+" oninput="salvarAlteracoes()">
    </div>

    <div class="grupo-input">
      <label for="inputCor">Cor Principal:</label>
      <input type="color" id="inputCor" oninput="salvarAlteracoes()">
    </div>

    <div class="grupo-input">
      <label for="inputFonte">Fonte:</label>
      <select id="inputFonte" onchange="salvarAlteracoes()">
        <option value="'Arial', sans-serif">Arial</option>
        <option value="'Courier New', Courier, monospace">Courier New</option>
        <option value="'Times New Roman', Times, serif">Times New Roman</option>
        <option value="'Impact', sans-serif">Impact</option>
        <option value="'Comic Sans MS', cursive, sans-serif">Comic Sans</option>
      </select>
    </div>

    <div class="grupo-input">
      <label for="inputMoldura">Moldura:</label>
      <select id="inputMoldura" onchange="salvarAlteracoes()">
        <option value="flores">Flores</option>
        <option value="estrelas">Estrelas</option>
        <option value="confetes">Confetes</option>
        <option value="geometria">Geometria</option>
        <option value="espaco">Espaço</option>
      </select>
    </div>
    
    <div class="grupo-input">
      <label>Arte da Frente (Imagem)</label>
      <input type="file" id="uploadFrente" accept="image/*" onchange="carregarImagemBase64(this, 'frente')">
    </div>

    <div class="grupo-input">
      <label>Arte do Verso (Imagem)</label>
      <input type="file" id="uploadVerso" accept="image/*" onchange="carregarImagemBase64(this, 'verso')">
    </div>
  </div>

  <div class="area-carta">
    <div class="controles">
      <button onclick="virarCarta()">Mostrar Verso</button>
      <button onclick="exportarPNG()">Baixar Esta Carta (PNG)</button>
      <button id="btnExportarA4" onclick="exportarBaralhoA4()" style="background-color: #e74c3c; color: white;">Exportar Baralho (Folhas A4)</button>
    </div>

    <div class="cena-carta">
      <div class="carta" id="cartaContainer">
        <div class="face card-front" id="front">
          <div class="border-pattern flores" id="borderPattern"></div>
          
          <div class="symbol" id="symbol">
            <span id="formulaPreview">+</span>
          </div>
          
          <div class="art" id="frontArt"></div>
          
          <!-- O ID number recebe dinamicamente as classes de estilo -->
          <div class="big-number estilo-padrao" id="number">1</div>
          <div class="name" id="name">ANA</div>
        </div>
        <div class="face card-back" id="back">
          <div class="back-bg" id="backArt"></div>
          <div class="back-overlay"></div>
          <div class="back-symbol" id="backSymbol">+</div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
